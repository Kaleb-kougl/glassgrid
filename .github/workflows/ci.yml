name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      rows:
        description: Rows in the generated E2E fixture
        required: false
        default: '1000000'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # One cache dir for both @electron/get (electron_config_cache) and electron-builder (ELECTRON_CACHE).
  electron_config_cache: ${{ github.workspace }}/.cache/electron
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  GLASSGRID_E2E_ROWS: ${{ github.event.inputs.rows || '1000000' }}

jobs:
  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Third-party notices are up to date
        run: node scripts/third-party-notices.js --check
      # Playwright's Chromium for the engine worker test and the web demo E2E (both use @playwright/test
      # from the lockfile, so one browser build serves both). The browser is cached; its OS packages are not.
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @glassgrid/engine exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright's Chromium
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @glassgrid/engine exec playwright install --with-deps chromium
      - name: Install Chromium's system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @glassgrid/engine exec playwright install-deps chromium
      # The engine on DuckDB-WASM in a real Web Worker (packages/engine/e2e).
      - run: pnpm --filter @glassgrid/engine e2e
      # The web demo: first-load budget, then its production build in Chromium with vercel.json's headers.
      - run: pnpm --filter @glassgrid/web size
      - run: pnpm --filter @glassgrid/web exec playwright test
      - name: Upload browser test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-results
          path: |
            packages/engine/test-results/
            apps/web/test-results/
          if-no-files-found: ignore

  e2e:
    name: Build + E2E (${{ matrix.os }})
    needs: checks
    runs-on: ${{ matrix.os }}
    # Build, two E2E passes on the 1M-row fixture and packaging; Windows runners are the slowest.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # arm64
            packaged: release/0.0.0/mac-arm64/Glassgrid.app/Contents/MacOS/Glassgrid
            run: ''
          - os: windows-latest
            packaged: release/0.0.0/win-unpacked/Glassgrid.exe
            run: ''
          - os: ubuntu-latest
            packaged: release/0.0.0/linux-unpacked/glassgrid
            run: xvfb-run --auto-servernum
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Cache Electron binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.ELECTRON_CACHE }}
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ runner.os }}-${{ runner.arch }}-
      - run: pnpm install --frozen-lockfile
      - name: Download Electron binary
        # Electron 44 fetches its binary lazily; do it up front so failures are obvious.
        run: pnpm --filter @glassgrid/desktop exec install-electron

      - name: Allow Chromium's sandbox on Ubuntu 24.04
        if: runner.os == 'Linux'
        # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor,
        # which Electron's renderer sandbox needs.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - run: pnpm build

      - name: E2E (unpackaged build)
        run: ${{ matrix.run }} pnpm --filter @glassgrid/desktop e2e

      - name: Package (unsigned, unpacked directory)
        run: pnpm --filter @glassgrid/desktop exec electron-builder --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: E2E (packaged app, verifies asarUnpack of the DuckDB binding)
        run: ${{ matrix.run }} pnpm --filter @glassgrid/desktop e2e
        env:
          GLASSGRID_E2E_EXECUTABLE: ${{ github.workspace }}/apps/desktop/${{ matrix.packaged }}

      - name: Upload benchmark baseline
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-${{ matrix.os }}
          path: apps/desktop/e2e-results/
          if-no-files-found: warn

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            apps/desktop/playwright-report/
            apps/desktop/test-results/
          if-no-files-found: ignore
